pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,mjs,json,md,css,html,yml,yaml}'
      run: npx prettier --write {staged_files} && git add {staged_files}
    lint:
      glob: '*.{js,jsx,ts,tsx,mjs}'
      run: npx eslint {staged_files}

pre-push:
  parallel: true
  commands:
    check-all:
      run: npm run check-all
    test:
      run: npm run test
